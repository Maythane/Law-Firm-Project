{% extends "base/layout.html" %}
{% block content %}
<div class="login-page">
  <div class="login-brand">
    {% include "base/_brand_icon.html" %}
    <p>ระบบผู้ช่วยจัดการคดีและตารางนัดหมายสำหรับทนายความ</p>
  </div>
  <div class="login-card">
    <h2>เข้าสู่ระบบ</h2>
    {% if error %}<p class="banner-warn" role="alert"><strong>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง หรือบัญชีถูกปิดใช้งาน</strong></p>{% endif %}
    <form method="post" action="/login">
      <label>ชื่อผู้ใช้ <input type="text" name="username" required autofocus></label>
      <label>รหัสผ่าน <input type="password" name="password" required></label>
      <button type="submit">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>
{% endblock %}
