{% if pending %}
{% for a in pending %}
<div class="prow">
  <div>
    <div class="t2">{{ a.case.title }}</div>
    <div class="m2">{{ a.case.court_name }} · มอบหมายโดย {{ a.assigned_by.display_name() }} · {{ a.assigned_at|thaidate }}</div>
    {% if error_assignment_id == a.id %}<div class="m2" style="color:var(--pico-del-color)">{{ decline_error }}</div>{% endif %}
  </div>
  <div class="actions">
    <form hx-post="/assignments/{{ a.id }}/accept" hx-target="#pending-list" hx-swap="innerHTML"
          hx-confirm="ยืนยันรับคดี “{{ a.case.title }}”?&#10;เมื่อรับแล้ว ถอนตัวได้เฉพาะเมื่อ manager อนุมัติ&#10;ตอนนี้คุณมีภาระงาน {{ workload }} รายการ">
      <button type="submit">รับคดี</button>
    </form>
    <details style="display:inline-block">
      <summary role="button" class="secondary">ไม่รับ</summary>
      <form hx-post="/assignments/{{ a.id }}/decline" hx-target="#pending-list" hx-swap="innerHTML">
        <label for="decline-reason-{{ a.id }}" class="sr-only">เหตุผลที่ไม่รับคดี {{ a.case.title }}</label>
        <textarea id="decline-reason-{{ a.id }}" name="reason" placeholder="เหตุผลที่ไม่รับ (บังคับกรอก)" required></textarea>
        <button type="submit">ส่ง</button>
      </form>
    </details>
  </div>
</div>
{% endfor %}
{% else %}
<p>ไม่มีคดีรอตอบรับ</p>
{% endif %}
